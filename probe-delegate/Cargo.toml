[package]
name = "freenet-probe-delegate"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Minimal delegate that exercises host capabilities: wakeups and contract GET."

# Own workspace: a delegate wasm is an artifact with a key.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
freenet-stdlib = { version = "0.10.0", features = ["contract"] }

[features]
default = ["freenet-main-delegate"]
freenet-main-delegate = []
# Imports the wakeup host function. A node without it cannot even instantiate
# the wasm, so it is a separate build.
wakeup = []
# The stdlib macros test this feature; declare it so the cfg is known.
trace = ["freenet-stdlib/trace"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
