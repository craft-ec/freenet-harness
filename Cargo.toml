[package]
name = "freenet-harness"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Drives a real Freenet node: deploys contracts, round-trips state, records timings."

[dependencies]
craftec-block-contract = { path = "../freenet-contracts/block", default-features = false }
# Pinned to the SAME rev the Block contract uses. A second copy of the tree
# library would give the harness its own block ids, and a pack ordered by those
# ids is a pack the contract refuses for a reason the run could not see.
freenet-prolly = { git = "https://github.com/craft-ec/freenet-prolly", rev = "e2756c8" }
# The Bag's own wire code and mining helpers: the harness must not have a
# second opinion about the format it is testing.
craftec-bag-contract = { path = "../freenet-contracts/bag", default-features = false, features = ["testing"] }
craftec-register-contract = { path = "../freenet-contracts/register", default-features = false, features = ["testing"] }
craftec-set-contract = { path = "../freenet-contracts/set", default-features = false, features = ["testing"] }
freenet-stdlib = { version = "0.10.0", features = ["net"] }
blake3 = "1"
# For the contract-artifact check. The contracts' own build.sh reports
# sha256, so the harness must speak the same digest or the check is theatre.
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
getrandom = { version = "0.2", features = ["std"] }
# The harness is a test tool and records generously. A NORMAL dependency here,
# unlike in prolly and the contracts: nothing in this repository is compiled
# into a contract's wasm, so there is no closure to keep it out of.
instrument = { git = "https://github.com/craft-ec/craftworks-instrument", rev = "d765891" }
